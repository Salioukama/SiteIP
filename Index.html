<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACCESS DETECTED</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #000;
      color: #ff1a1a;

      font-family: "Courier New", monospace;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Effet rouge autour de l'écran */
    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      box-shadow:
        inset 0 0 120px rgba(255, 0, 0, 0.35);

      animation: pulsation 2s infinite;
    }

    /* Scanlines */
    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.025) 1px,
          transparent 1px,
          transparent 3px
        );
    }

    .terminal {
      width: 90%;
      max-width: 850px;

      padding: 35px;

      border: 1px solid #ff1a1a;

      background: rgba(5, 0, 0, 0.94);

      box-shadow:
        0 0 20px rgba(255,0,0,.5),
        0 0 70px rgba(255,0,0,.2);

      position: relative;
    }

    .danger {
      font-size: 14px;
      letter-spacing: 5px;

      color: #ff0000;

      margin-bottom: 20px;

      animation: blink .8s infinite;
    }

    h1 {
      margin: 0;

      font-size: clamp(30px, 6vw, 65px);

      letter-spacing: 5px;

      text-shadow:
        3px 0 #750000,
        -3px 0 #ff0000;

      animation: glitch .15s infinite;
    }

    .separator {
      width: 100%;
      height: 1px;

      background: #ff0000;

      margin: 25px 0;

      box-shadow: 0 0 10px red;
    }

    .message {
      color: #aaa;

      line-height: 1.8;

      text-align: left;
    }

    .message span {
      color: red;
    }

    .ip-container {
      margin: 35px 0;

      padding: 25px;

      border-left: 4px solid red;

      background: rgba(255, 0, 0, .06);

      text-align: left;
    }

    .label {
      color: #777;

      font-size: 13px;

      letter-spacing: 3px;
    }

    #ip {
      margin-top: 10px;

      font-size: clamp(25px, 5vw, 45px);

      color: #ff0000;

      text-shadow: 0 0 15px red;

      word-break: break-all;
    }

    #console {
      height: 110px;

      overflow: hidden;

      margin-top: 20px;

      color: #777;

      font-size: 13px;

      line-height: 1.7;

      text-align: left;
    }

    #console .red {
      color: red;
    }

    button {
      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: 1px solid red;

      background: transparent;

      color: red;

      font-family: "Courier New", monospace;
      font-weight: bold;

      letter-spacing: 3px;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      color: black;
      background: red;

      box-shadow: 0 0 30px red;
    }

    .footer {
      margin-top: 20px;

      font-size: 11px;

      color: #444;

      letter-spacing: 2px;
    }

    .flash {
      animation: flash .15s;
    }

    @keyframes blink {

      0%, 45% {
        opacity: 1;
      }

      46%, 60% {
        opacity: 0;
      }

      61%, 100% {
        opacity: 1;
      }

    }

    @keyframes pulsation {

      0%, 100% {
        box-shadow:
          inset 0 0 100px rgba(255,0,0,.2);
      }

      50% {
        box-shadow:
          inset 0 0 180px rgba(255,0,0,.45);
      }

    }

    @keyframes glitch {

      0% {
        transform: translate(0);
      }

      25% {
        transform: translate(-1px, 1px);
      }

      50% {
        transform: translate(1px, -1px);
      }

      75% {
        transform: translate(-1px, 0);
      }

      100% {
        transform: translate(0);
      }

    }

    @keyframes flash {

      from {
        background: #500;
      }

      to {
        background: #000;
      }

    }

  </style>
</head>

<body>

  <div class="terminal">

    <div class="danger">
      ⚠ SECURITY EVENT DETECTED
    </div>

    <h1>
      ACCESS DETECTED
    </h1>

    <div class="separator"></div>

    <div class="message">

      &gt; Connexion entrante détectée<br>

      &gt; Analyse de la connexion :
      <span>ACTIVE</span><br>

      &gt; Adresse réseau détectée :
      <span>YES</span>

    </div>

    <div class="ip-container">

      <div class="label">
        YOUR PUBLIC IP ADDRESS
      </div>

      <div id="ip">
        ANALYSE...
      </div>

    </div>

    <div id="console">
      &gt; Initialisation...
    </div>

    <button onclick="copierIP()">
      [ COPIER L'ADRESSE IP ]
    </button>

    <div class="footer">
      SYSTEM // NETWORK ANALYSIS // SESSION ACTIVE
    </div>

  </div>


  <script>

    let adresseIP = "";

    const consoleElement =
      document.getElementById("console");


    /*
      Messages purement visuels.
      Ils servent uniquement à créer
      l'ambiance "terminal inquiétant".
    */

    const messages = [

      "Initialisation du terminal...",

      "Analyse de la connexion...",

      "Recherche de l'adresse réseau...",

      "Connexion détectée.",

      "Lecture des informations publiques...",

      "Adresse IP trouvée.",

      "SESSION ACTIVE"

    ];


    let messageIndex = 0;


    function ajouterMessage() {

      if (messageIndex >= messages.length) {
        return;
      }

      const ligne =
        document.createElement("div");


      ligne.textContent =
        "> " + messages[messageIndex];


      if (
        messageIndex ===
        messages.length - 1
      ) {

        ligne.classList.add("red");

      }


      consoleElement.appendChild(ligne);


      consoleElement.scrollTop =
        consoleElement.scrollHeight;


      messageIndex++;


      setTimeout(
        ajouterMessage,
        500
      );

    }


    consoleElement.innerHTML = "";

    ajouterMessage();


    /*
      Récupération de l'adresse IP publique
    */

    fetch("https://api.ipify.org?format=json")

      .then(reponse => {

        if (!reponse.ok) {

          throw new Error(
            "Erreur réseau"
          );

        }

        return reponse.json();

      })

      .then(donnees => {

        adresseIP = donnees.ip;

        document
          .getElementById("ip")
          .textContent =
          adresseIP;


        document.body
          .classList.add("flash");


        setTimeout(() => {

          document.body
            .classList.remove("flash");

        }, 200);

      })

      .catch(() => {

        document
          .getElementById("ip")
          .textContent =
          "IP NON DISPONIBLE";

      });


    /*
      Copier l'adresse IP
    */

    async function copierIP() {

      if (!adresseIP) {
        return;
      }


      try {

        await navigator.clipboard
          .writeText(adresseIP);


        const bouton =
          document.querySelector("button");


        bouton.textContent =
          "[ IP COPIÉE ]";


        setTimeout(() => {

          bouton.textContent =
            "[ COPIER L'ADRESSE IP ]";

        }, 1500);


      } catch (erreur) {

        alert(
          "Impossible de copier l'adresse IP."
        );

      }

    }

  </script>

</body>
</html>
